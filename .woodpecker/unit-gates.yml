# Woodpecker CI (ci.metabolomics.us) -- the herdr-handoff gate: lint subset, shipped data files, conflict markers,
# the whole unit suite.  The checks live in scripts/ci/unit-gates.sh, so `bash scripts/ci/unit-gates.sh` reproduces
# this pipeline from a clean checkout and CI holds nothing that a local run does not.
#
# Conventions taken from herdr-engineering (docs/operations/ci-gates.md there): `image:` names an executable on the
# agent rather than a container; skip_clone plus a plain git fetch of $CI_COMMIT_SHA using the credential the agent
# stages at /etc/woodpecker-git-credentials; triggers include `manual`, so a run can be re-proved without pushing.
#
# Two deliberate differences, both cost-driven:
#
#   * One pipeline instead of the structural/unit split.  herdr-engineering separates a ~1.5 s structural gate from a
#     ~55 min unit gate so that `main` can be gated per push without spending ~78 runner-hours a day.  The whole
#     herdr-handoff gate is about 30 s, so the split buys nothing and `main` gets the full suite on every push.
#   * No include filter on the pull_request trigger, so the check reports on every pull request, documentation-only
#     ones included.  That is what makes it safe to mark required in GitHub: a filtered check never reports on the
#     PRs it filters out, and a required check that never reports parks the PR on "waiting for status to be
#     reported" with no way to satisfy it.
#
# Not run here, on purpose: the `integration` marker (16 tests) drives real harness CLIs -- claude, pi, codex,
# opencode.  A step that skips because the binary is absent is green without proving anything, so it stays an opt-in
# local run: `pytest -m integration` where those CLIs are installed.
#
# No journal either (herdr-engineering mirrors its gate output to a durable directory): its reason is a 55-minute
# step killed mid-suite.  This run is ~30 s and the server keeps the step log; read it with
# `python3 scripts/ci/wp_log.py berlinguyinca/herdr-handoff <pipeline>` from a herdr-engineering checkout.
when:
  - event: manual
  - event: pull_request
  - event: push
    branch: master

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-master}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      # Depth 1 is enough: no test reads this repository's history, the suite builds its own throwaway repos in tmp.
      - 'git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"'
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  - name: unit-gates
    image: bash
    commands:
      - 'set -eu'
      - 'bash scripts/ci/unit-gates.sh'

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-handoff"
version = "0.6.0"
description = "Portable handoff packages for Herdr harnesses"
requires-python = ">=3.12"

[project.optional-dependencies]
# The gate's own tools (scripts/ci/unit-gates.sh).  ruff is pinned exactly: the gate selects a small rule set, and an
# unpinned ruff lets a release decide whether CI is green.
# jsonschema is a test-only dependency, but it must be declared: two tests validate the shipped
# schemas/handoff-v2.schema.json against the builder via pytest.importorskip, and with nothing installing it they
# skipped silently in the gate venv -- measured, `SKIPPED ... No module named 'jsonschema'` twice, in every run of the
# gate including CI.  The schema is published for other people's dashboards, so its conformance test has to actually
# execute.
dev = ["pytest>=8", "ruff==0.14.5", "jsonschema>=4"]

[project.scripts]
herdr-handoff = "herdr_handoff_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["herdr_handoff", "herdr_handoff_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: runs a real harness CLI (slow, needs it installed); opt in with -m integration"]

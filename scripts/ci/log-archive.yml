# Where a CI gate keeps a durable copy of its own output, so a step the agent kills -- or whose log tail the agent
# drops, which is what this gate hit on pipeline 1 -- still leaves its lines somewhere readable.
# The first directory whose parent exists and is writable wins; none usable means the run keeps only a node-local
# journal, and the gate says so on the first lines of the log.
# One file per run: <directory>/<owner>_<repo>/<pipeline>-<gate>.log.  Nothing prunes these; each is a few KB here.
directories:
  - /quobyte/metabolomicsgrp/it/server/woodpecker/ci-logs
